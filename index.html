<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1116">
<title>NC.OS · Mobile</title>

<style>
:root {
  color-scheme: dark;
  --bg: #0e1116;
  --panel: #181c23;
  --line: #2a303a;
  --text: #fff;
  --muted: #aab4c2;
  --green: #46ff9a;
  --blue: #5ea7ff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 system-ui, sans-serif;
}

main { max-width: 620px; margin: 0 auto; }

.panel {
  margin-bottom: 12px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
}

h1 { margin: 0 0 10px; font-size: 20px; }
h2 { margin: 0 0 10px; font-size: 15px; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); font-size: 12px; }

.status, .controls {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.badge {
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #222831;
  font-size: 12px;
}

.matrix {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}

.cell {
  min-height: 54px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #262d38;
  color: var(--text);
  font: inherit;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
}

.cell.active {
  border-color: var(--green);
  background: var(--green);
  color: #000;
}

button:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.controls button {
  min-height: 42px;
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #262d38;
  color: var(--text);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

.controls button:hover { background: #343d4a; }
.controls button.primary { background: var(--green); color: #000; }
.controls button[aria-pressed="true"] { border-color: var(--blue); }

.bar {
  height: 24px;
  margin-top: 8px;
  overflow: hidden;
  border-radius: 6px;
  background: #29303a;
}

.fill {
  display: flex;
  width: 0;
  height: 100%;
  align-items: center;
  padding-left: 7px;
  overflow: hidden;
  background: var(--blue);
  color: #06121f;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  transition: width .2s ease;
}

.fill.green { background: var(--green); color: #02120a; }

#clusterGraph, #trioGraph {
  display: grid;
  gap: 5px;
}

#log {
  max-height: 220px;
  overflow: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font: 12px/1.5 ui-monospace, monospace;
}

#narrativeBox {
  min-height: 24px;
  overflow-wrap: anywhere;
  font-weight: 700;
}

textarea {
  display: block;
  width: 100%;
  min-height: 130px;
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #10141a;
  color: var(--text);
  font: 12px/1.5 ui-monospace, monospace;
  resize: vertical;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}
</style>
</head>

<body>
<main>
  <header class="panel">
    <h1>NC.OS · MOBILE</h1>
    <div class="status">
      <div class="badge">SEEK <span id="seek">0</span></div>
      <div class="badge">HALT <span id="haltState">AUS</span></div>
      <div class="badge">KETTE 81 → 9 → 3 → 1</div>
      <div class="badge">NARRATIV <span id="narrativeView">–</span></div>
    </div>
  </header>

  <section class="panel">
    <h2>MATRIX 1</h2>
    <div class="matrix" id="m0"></div>
  </section>

  <section class="panel">
    <h2>MATRIX 2</h2>
    <div class="matrix" id="m1"></div>
  </section>

  <section class="panel">
    <h2>MATRIX 3</h2>
    <div class="matrix" id="m2"></div>
  </section>

  <section class="panel">
    <div class="controls">
      <button id="haltBtn" aria-pressed="false">HALT</button>
      <button id="runBtn" class="primary">VERDICHTEN</button>
      <button id="saveBtn">SPEICHERN</button>
      <button id="loadBtn">LADEN</button>
      <button id="exportBtn">EXPORT</button>
      <button id="importBtn">IMPORT</button>
    </div>
  </section>

  <section class="panel">
    <h2>9 CLUSTER</h2>
    <div id="clusterGraph"></div>
  </section>

  <section class="panel">
    <h2>3 TRIOLETS</h2>
    <div id="trioGraph"></div>
  </section>

  <section class="panel">
    <h2>NARRATIV</h2>
    <div id="narrativeBox">Noch leer</div>
  </section>

  <section class="panel">
    <h2>EXPORT / IMPORT · JSON</h2>
    <textarea id="jsonBox" spellcheck="false" aria-label="JSON-Daten"></textarea>
  </section>

  <section class="panel">
    <h2>APPEND-ONLY LOG</h2>
    <div id="log" aria-live="polite"></div>
  </section>
</main>

<script>
"use strict";

(() => {
  const STORAGE_KEY = "NCOS_V2";
  const $ = id => document.getElementById(id);

  const state = {
    halt: false,
    seek: 0,
    matrices: Array.from({ length: 3 }, () => Array(9).fill(false)),
    cluster9: Array(9).fill(0),
    trio3: Array(3).fill(0),
    narrative: "",
    log: ["ROOT JA", "SYSTEM START"]
  };

  function appendLog(message) {
    state.seek += 1;
    state.log.push(`#${state.seek} | ${message}`);
    renderLog();
  }

  function guard() {
    if (!state.halt) return false;
    appendLog("HALT BLOCK");
    return true;
  }

  function renderMatrices() {
    state.matrices.forEach((matrix, matrixIndex) => {
      const root = $("m" + matrixIndex);
      root.replaceChildren();

      matrix.forEach((active, cellIndex) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "cell" + (active ? " active" : "");
        button.textContent = String(cellIndex + 1);
        button.setAttribute(
          "aria-label",
          `Matrix ${matrixIndex + 1}, Zelle ${cellIndex + 1}${active ? ", aktiv" : ", inaktiv"}`
        );
        button.setAttribute("aria-pressed", String(active));

        button.addEventListener("click", () => {
          if (guard()) return;
          state.matrices[matrixIndex][cellIndex] = !state.matrices[matrixIndex][cellIndex];
          appendLog(`M${matrixIndex + 1} CELL ${cellIndex + 1}`);
          renderAll();
        });

        root.appendChild(button);
      });
    });
  }

  function compress81to9() {
    const result = [];

    for (let group = 0; group < 9; group++) {
      let score = 0;

      for (const matrix of state.matrices) {
        for (let cell = 0; cell < 9; cell++) {
          if (matrix[cell]) score += ((group + cell) % 3 === 0) ? 2 : 1;
        }
      }

      result.push(score);
    }

    state.cluster9 = result;
    appendLog("81→9");
  }

  function compress9to3() {
    const c = state.cluster9;
    state.trio3 = [
      c[0] + c[1] + c[2],
      c[3] + c[4] + c[5],
      c[6] + c[7] + c[8]
    ];
    appendLog("9→3");
  }

  function compress3to1() {
    const sum = state.trio3.reduce((total, value) => total + value, 0);
    state.narrative = "NC-" + sum;
    appendLog("3→1 " + state.narrative);
  }

  function runPipeline() {
    if (guard()) return;
    compress81to9();
    compress9to3();
    compress3to1();
    renderAll();
  }

  function renderBars(rootId, values, className, scale) {
    const root = $(rootId);
    root.replaceChildren();

    values.forEach((value, index) => {
      const bar = document.createElement("div");
      bar.className = "bar";

      const fill = document.createElement("div");
      fill.className = "fill" + (className === "green" ? " green" : "");
      fill.style.width = `${Math.min(value * scale, 100)}%`;
      fill.textContent = `${index + 1} · ${value}`;

      bar.appendChild(fill);
      root.appendChild(bar);
    });
  }

  function renderLog() {
    $("log").textContent = state.log.join("\n");
    $("log").scrollTop = $("log").scrollHeight;
    $("seek").textContent = String(state.seek);
  }

  function renderAll() {
    renderMatrices();
    renderBars("clusterGraph", state.cluster9, "blue", 4);
    renderBars("trioGraph", state.trio3, "green", 2);

    $("haltState").textContent = state.halt ? "EIN" : "AUS";
    $("haltBtn").setAttribute("aria-pressed", String(state.halt));
    $("narrativeView").textContent = state.narrative || "–";
    $("narrativeBox").textContent = state.narrative || "Noch leer";
    renderLog();
  }

  function validState(data) {
    return data &&
      Array.isArray(data.matrices) &&
      data.matrices.length === 3 &&
      data.matrices.every(matrix =>
        Array.isArray(matrix) &&
        matrix.length === 9 &&
        matrix.every(value => typeof value === "boolean")
      );
  }

  $("haltBtn").addEventListener("click", () => {
    state.halt = !state.halt;
    appendLog(state.halt ? "HALT EIN" : "HALT AUS");
    renderAll();
  });

  $("runBtn").addEventListener("click", runPipeline);

  $("saveBtn").addEventListener("click", () => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      appendLog("STATE GESPEICHERT");
    } catch (error) {
      appendLog("SPEICHERN FEHLER: " + error.message);
    }
  });

  $("loadBtn").addEventListener("click", () => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        appendLog("KEIN STATE");
        return;
      }

      const data = JSON.parse(raw);
      if (!validState(data)) throw new Error("Ungültiges State-Format");

      state.halt = Boolean(data.halt);
      state.matrices = data.matrices.map(matrix => [...matrix]);
      state.cluster9 = Array.isArray(data.cluster9) && data.cluster9.length === 9
        ? data.cluster9.map(Number) : Array(9).fill(0);
      state.trio3 = Array.isArray(data.trio3) && data.trio3.length === 3
        ? data.trio3.map(Number) : Array(3).fill(0);
      state.narrative = typeof data.narrative === "string" ? data.narrative : "";

      appendLog("STATE GELADEN");
      renderAll();
    } catch (error) {
      appendLog("LADEN FEHLER: " + error.message);
    }
  });

  $("exportBtn").addEventListener("click", () => {
    $("jsonBox").value = JSON.stringify(state, null, 2);
    appendLog("EXPORT");
  });

  $("importBtn").addEventListener("click", () => {
    try {
      const data = JSON.parse($("jsonBox").value);
      if (!validState(data)) throw new Error("Ungültiges State-Format");

      state.halt = Boolean(data.halt);
      state.matrices = data.matrices.map(matrix => [...matrix]);
      state.cluster9 = Array.isArray(data.cluster9) && data.cluster9.length === 9
        ? data.cluster9.map(Number) : Array(9).fill(0);
      state.trio3 = Array.isArray(data.trio3) && data.trio3.length === 3
        ? data.trio3.map(Number) : Array(3).fill(0);
      state.narrative = typeof data.narrative === "string" ? data.narrative : "";

      appendLog("IMPORT");
      renderAll();
    } catch (error) {
      appendLog("IMPORT FEHLER: " + error.message);
    }
  });

  renderAll();
})();
</script>
</body>
</html>
