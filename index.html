  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.\[overflow-wrap\:anywhere\] {
  overflow-wrap: anywhere;
}

:root{
  --bg:#050505;
  --surface:#0c0c0c;
  --surface2:#111111;
  --line:#292929;
  --gold:#ffd700;
  --cyan:#00d9ff;
  --green:#00ff94;
  --text:#e8f0fa;
  --muted:#999999;
  --red:#ff3b30;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#050505;
    --surface:#0c0c0c;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

input[type="number"],input[type="text"],input[type="search"],input[type="url"],textarea,select{
  background:#000;
  border:1px solid #444;
  color:var(--text);
  border-radius:5px;
  padding:9px 11px;
  width:100%;
  outline:none
}

textarea{
  min-height:220px;
  resize:vertical;
  line-height:1.45
}

input:focus,textarea:focus,select:focus{
  border-color:var(--gold);
  outline:2px solid var(--gold);
  outline-offset:1px
}

input[type="range"]{
  width:100%;
  accent-color:var(--gold)
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:8px;
  padding:16px;
  overflow:hidden
}

.gold{
  color:var(--gold)
}

.cyan{
  color:var(--cyan)
}

.muted{
  color:var(--muted)
}

.green{
  color:var(--green)
}

.btn-gold{
  background:var(--gold);
  color:#000;
  border:1px solid var(--gold);
  border-radius:5px;
  padding:10px 16px;
  font-weight:800
}

.btn-green{
  background:var(--green);
  color:#000;
  border:1px solid var(--green);
  border-radius:5px;
  padding:10px 16px;
  font-weight:800
}

.btn-ghost{
  background:#111;
  color:#ddd;
  border:1px solid #444;
  border-radius:5px;
  padding:9px 14px
}

.btn-cyan{
  background:var(--cyan);
  color:#000;
  border:1px solid var(--cyan);
  border-radius:5px;
  padding:10px 16px;
  font-weight:800
}

.chip{
  border:1px solid #444;
  border-radius:999px;
  padding:6px 11px;
  font-size:12px;
  background:#111;
  color:#ddd
}

.chip.active{
  background:var(--gold);
  color:#000;
  border-color:var(--gold);
  font-weight:800
}

.chip.active-cyan{
  background:var(--cyan);
  color:#000;
  border-color:var(--cyan);
  font-weight:800
}

.chip.active-green{
  background:var(--green);
  color:#000;
  border-color:var(--green);
  font-weight:800
}

.station{
  border:1px solid var(--line);
  border-radius:8px;
  padding:11px 12px;
  background:#0a0a0a
}

.kon{
  aspect-ratio:1;
  border:1px solid var(--line);
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  background:#0a0a0a;
  cursor:pointer;
  min-height:36px
}

.kon.sel{
  background:var(--gold);
  color:#000;
  font-weight:900;
  border-color:var(--gold)
}

.kon.home{
  outline:2px solid var(--cyan);
  outline-offset:1px
}

.bar{
  height:14px;
  background:#000;
  border:1px solid var(--line);
  border-radius:999px;
  overflow:hidden
}

.bar > div{
  height:100%;
  background:linear-gradient(90deg,var(--cyan),var(--gold));
  transition:width .2s
}

.pill{
  padding:5px 8px;
  border:1px solid #444;
  border-radius:20px;
  color:#bbb;
  font-size:11px;
  background:#0a0a0a
}

.pill.ok{
  border-color:var(--green);
  color:var(--green)
}

.pill.gold{
  border-color:var(--gold);
  color:var(--gold)
}

pre{
  overflow:auto;
  max-height:360px;
  padding:10px;
  border:1px solid #222;
  background:#000;
  color:#b6ffc9;
  line-height:1.45;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}

.log{
  overflow:auto;
  max-height:220px;
  padding:10px;
  border:1px solid #222;
  background:#000;
  color:#b6ffc9;
  line-height:1.45;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}

canvas{
  display:block;
  max-width:100%;
  border:1px solid #1e2925;
  background:#020303
}

.last\:border-0:last-child {
  border-width: 0px;
}

@media (min-width: 640px) {
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:grid-cols-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .sm\:gap-3 {
    gap: 0.75rem;
  }

  .sm\:p-4 {
    padding: 1rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:text-\[15px\] {
    font-size: 15px;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-\[1fr_140px_1fr_auto\] {
    grid-template-columns: 1fr 140px 1fr auto;
  }

  .md\:grid-cols-\[200px_1fr\] {
    grid-template-columns: 200px 1fr;
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.4fr_1fr\] {
    grid-template-columns: 1.4fr 1fr;
  }

  .lg\:grid-cols-\[280px_1fr\] {
    grid-template-columns: 280px 1fr;
  }

  .lg\:grid-cols-\[340px_1fr\] {
    grid-template-columns: 340px 1fr;
  }

  .lg\:flex-row {
    flex-direction: row;
  }
}
