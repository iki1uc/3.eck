  background: var(--panel2);
}

button {
  cursor: pointer;
}

  background: var(--green);
  color: #000;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

}

    -o-tab-size: 2;
       tab-size: 2;
  font-size: 15px;
}

  font-size: 15px;

  border-radius: 10px;
  padding: 12px;
  margin: 0;
}

  border-radius: 10px;
  padding: 12px;
  margin: 0 0 10px 0;
}

  background: var(--panel2);

  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  color: var(--green);
}

.chip {
  display: inline-block;
  padding: 2px 8px;
  border: 1px solid var(--line);
  font-size: 11px;
}

.anchor {
  display: inline-block;

  padding: 4px 8px;

  color: var(--white);
  border-radius: 6px;
  font-size: 13px;
}

}

.warn {

.err {

  color: var(--green);
  font-size: 18px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cell.active {

}

  border-radius: 10px;
  font-weight: 800;
  font-size: 15px;
  background: var(--panel2);
  color: var(--green);
}

.ctl.primary {
  background: var(--green);

  border-color: var(--green);
}

.ctl.danger {
  background: #380000;
  color: #ffd7d7;
  border-color: #5a2f35;

  background: var(--red);

}

.big {

  color: #02120a;

  overflow-wrap: anywhere;

  letter-spacing: .1em;
}

.timer-ok {
  color: var(--timer-ok);
}

.timer-warn {
  color: var(--timer-warn);
}

.timer-bad {
  color: var(--timer-bad);
}

.timer-chain {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.timer-node {
  min-width: 44px;
  min-height: 48px;
  display: grid;
  place-items: center;
  text-align: center;
  border: 1px solid var(--timer-border);
  padding: 8px 6px;
  color: var(--timer-muted);
}

.timer-node.run {
  color: var(--timer-cyan);
  border-color: var(--timer-cyan);
}

.timer-node.ready {
  color: var(--timer-warn);
  border-color: var(--timer-warn);
}

.timer-node.pass {
  color: var(--timer-ok);
  border-color: var(--timer-ok);
}

.timer-blink {
  animation: timerblink 1s steps(2) infinite;
}

@keyframes timerblink {
  50% {
    opacity: .3;
  }
}

.bottom-nav button.active {
  background: var(--green);
  color: #000;
}

.bio-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}

.bio-card, .project-card, .platter {
  min-width: 0;
  padding: 10px;
  border: 1px solid var(--line);
  background: #000;
}

.bio-card pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.platters {
  display: grid;
  grid-template-columns: repeat(4, minmax(70px, 1fr));
  gap: 7px;
}

.platter b {
  display: block;
  color: var(--white);
  font-size: 16px;
}

.skill-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.skill-card {
  min-height: 150px;
  padding: 16px;
  border: 1px solid var(--line);
  background: linear-gradient(145deg, #0d1a24, #09141c);
  overflow-wrap: anywhere;
}

.skill-card h3 {
  margin-top: 12px;
}

.skill-icon {
  display: inline-grid;
  width: 38px;
  height: 38px;
  place-items: center;
  background: #202d13;
  color: var(--accent);
  font-size: 20px;
}

.skill-level {
  float: right;
  color: var(--muted);
  font-size: 11px;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.filter {
  border-radius: 999px;
}

.empty {
  padding: 20px;
  border: 1px dashed var(--line);
  text-align: center;
  color: var(--muted);
}

.eco {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}

.eco label {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  padding: 8px;
  border: 1px solid var(--line);
  cursor: pointer;
  overflow-wrap: anywhere;
}

.eco label input {
  flex-shrink: 0;
  min-height: 24px;
}

.tri {
  position: relative;
  width: min(100%, 340px);
  aspect-ratio: 1;
  margin: auto;
}

.tri svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.tri button {
  position: absolute;
  width: 82px;
}

.g3 {
  display: grid;
  grid-template-columns: 1fr;
  gap: 7px;
  max-width: 600px;
}

.pt {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 6px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  font-weight: 800;
  letter-spacing: .07em;
  font-size: 12px;
}

.g3 button {
  padding: 7px 4px;
  overflow-wrap: anywhere;
}

.g3 small {
  display: block;
  font-weight: 400;
}

.eds {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-top: 8px;
}

.box {
  min-width: 0;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
}

.box-head, .box-foot {
  padding: 4px 8px;
  border-bottom: 1px solid var(--line);
  font-size: 11px;
}

.box-foot {
  border-top: 1px solid var(--line);
  border-bottom: 0;
  color: var(--muted);
}

.box textarea {
  flex: 1;
  border: 0;
}

.eds.half .optional {
  display: none;
}

.eds.half textarea {
  min-height: 300px;
}

iframe {
  width: 100%;
  min-height: 230px;
  flex: 1;
  border: 0;
  background: #fff;
}

.art {
  display: block;
  width: 100%;
  min-height: 0;
  margin-bottom: 8px;
  padding: 10px;
  text-align: left;
}

.art small {
  display: block;
  font-weight: 400;
}

#zoomSlider {
  width: 100%;
  accent-color: var(--green);
}

#cursorBar {
  position: relative;
  height: 9px;
  margin: 14px 0;
  border-radius: 10px;
  background: #171717;
}

#cursor {
  position: absolute;
  top: -5px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #00ff88;
  box-shadow: 0 0 12px #00ff88;
}

#zoomView {
  min-height: 160px;
  white-space: pre;
}

#chainSvg {
  display: block;
  width: 100%;
  max-width: 330px;
  height: auto;
  margin: auto;
}

@media (max-width: 900px) {
  .eco {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 700px) {
  .skill-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .bio-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 560px) {
  .skill-grid {
    grid-template-columns: 1fr;
  }

  .eco {
    grid-template-columns: 1fr;
  }

  .platters {
    grid-template-columns: repeat(2, minmax(70px, 1fr));
  }

  .eds {
    grid-template-columns: 1fr;
  }

  table {
    font-size: 12px;
  }
}
