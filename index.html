  --ink: #ece9db;
  --muted: #7f8b96;
  --gold: #dfa32e;
  --gold-hi: #ffd968;
  --cyan: #3fe3ff;
  --cyan-dim: #175a6e;
  --danger: #ff5d73;
}

    --bg: #000000;
