.hidden {

:root {

html, body {

body {

}

button, input, select, textarea {

}

button {

}

button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible {

}

.small {

.shell {

.glitter {

  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

.glitter i {
  position: absolute;
  border-radius: 999px;
  background: var(--mint);

  opacity: .55;
  animation: twinkle 3.4s ease-in-out infinite alternate;
}

}

.glitter i:nth-child(5n) {

@keyframes twinkle {
