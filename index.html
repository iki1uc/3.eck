:root {
  color-scheme: dark;
  --bg: #000;
  --panel: #050a06;
  --panel2: #09120b;
  --green: #39ff75;
  --bright: #00ff88;
  --line: #1d7338;
  --muted: #7daa88;
  --white: #d8ffe1;
  --yellow: #ffe66b;
  --red: #ff6464;
  --blue: #5ea7ff;
  --txt: #d8ffe1;
  --card: #050a06;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000;
    --panel: #050a06;
    --panel2: #09120b;
    --green: #39ff75;
    --bright: #00ff88;
    --line: #1d7338;
    --muted: #7daa88;
    --white: #d8ffe1;
    --yellow: #ffe66b;
    --red: #ff6464;
    --blue: #5ea7ff;
    --txt: #d8ffe1;
    --card: #050a06;
  }
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--green);
}

body {
  font: 15px/1.5 Consolas, "Cascadia Mono", "Courier New", monospace;
}

button, input, select, textarea {
  font: inherit;
  color: var(--green);
}

button, select, input[type="text"], input[type="number"] {
  min-height: 48px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel2);
}

button {
  cursor: pointer;
}

button:hover, button.active, button.selected {
  background: var(--green);
  color: #000;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible, summary:focus-visible {
  outline: 2px solid var(--white);
  outline-offset: 2px;
}

textarea {
  width: 100%;
  min-height: 170px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #000;
  resize: vertical;
  -moz-tab-size: 2;
    -o-tab-size: 2;
       tab-size: 2;
  font-size: 15px;
}

input, select {
  font-size: 15px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  margin: 0;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  margin: 0 0 10px 0;
}

.badge {
  background: var(--panel2);
  border: 1px solid var(--line);
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  color: var(--green);
}

.anchor {
  display: inline-block;
  margin: 2px;
  padding: 4px 8px;
  border: 1px solid var(--line);
  color: var(--white);
  border-radius: 6px;
  font-size: 13px;
}

.small {
  font-size: 13px;
  color: var(--muted);
}

.good {
  color: var(--green);
}

.warn {
  color: var(--yellow);
}

.err {
  color: var(--red);
}

.cell {
  min-height: 56px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel2);
  color: var(--green);
  font-size: 18px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cell:active {
  transform: scale(.97);
}

.cell.active {
  background: var(--green);
  color: #000;
  border-color: var(--green);
}

.ctl {
  min-height: 48px;
  padding: 12px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-weight: 800;
  font-size: 15px;
  background: var(--panel2);
  color: var(--green);
}

.ctl.primary {
  background: var(--green);
  color: #000;
  border-color: var(--green);
}

.ctl.danger {
  background: #380000;
  color: #ffd7d7;
  border-color: #5a2f35;
}

.ctl.danger.on {
  background: var(--red);
  color: #000;
  border-color: var(--red);
}

.big {
  min-height: 56px !important;
  font-size: 16px !important;
}

.bar {
  height: 28px;
  background: #29303a;
  margin-bottom: 8px;
  border-radius: 8px;
  overflow: hidden;
}

.fill {
  height: 100%;
  background: var(--blue);
  display: flex;
  align-items: center;
  padding-left: 8px;
  font-size: 13px;
  font-weight: 800;
  color: #06121f;
  min-width: 30px;
}

.trioFill {
  height: 100%;
  background: var(--green);
  display: flex;
  align-items: center;
  padding-left: 8px;
  font-size: 13px;
  font-weight: 800;
  color: #02120a;
  min-width: 30px;
}

.logbox {
  height: 180px;
  max-height: 180px;
  overflow-y: auto;
  overflow-x: clip;
  white-space: pre-wrap;
  font-size: 13px;
  line-height: 1.55;
  font-family: Consolas, "Cascadia Mono", monospace;
  overflow-wrap: anywhere;
  background: #000;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
}

.jsonbox {
  width: 100%;
  height: 132px;
  background: #000;
  color: var(--white);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  font-family: Consolas, monospace;
  font-size: 13px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  resize: vertical;
}

.output {
  min-height: 42px;
  max-height: 280px;
  overflow: auto;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #000;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 13px;
}

.gate {
  padding: 14px;
  border: 2px solid #666;
  border-radius: 10px;
  background: #111;
  color: #aaa;
  text-align: center;
  font-size: 22px;
  font-weight: 800;
}

.gate.pass {
  border-color: var(--bright);
  background: #003811;
  color: var(--bright);
}

.gate.tune {
  border-color: var(--yellow);
  background: #382f00;
  color: var(--yellow);
}

.gate.fail {
  border-color: var(--red);
  background: #380000;
  color: var(--red);
}

.ladder {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  font-weight: bold;
}

.rung {
  min-width: 55px;
  padding: 8px 9px;
  border: 1px solid var(--line);
  text-align: center;
}

.rung.ok {
  border-color: var(--green);
  color: var(--green);
}

.rung.pending {
  border-color: var(--yellow);
  color: var(--yellow);
}

.rung.fail {
  border-color: var(--red);
  color: var(--red);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th, td {
  padding: 8px 6px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
  overflow-wrap: anywhere;
}

th {
  color: var(--muted);
  font-size: 12px;
  text-transform: uppercase;
}

.knot {
  min-width: 56px;
  min-height: 56px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: #020603;
  color: var(--green);
  cursor: pointer;
  text-align: center;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.knot.partner {
  border-color: var(--green);
  box-shadow: 0 0 14px var(--green);
}

.knot.selected {
  background: var(--green);
  color: #000;
}

/* Details: eine Sache zur Zeit, große Touch-Fläche */

details {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #020603;
  margin-bottom: 10px;
  overflow: hidden;
}

details summary {
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 12px;
  cursor: pointer;
  font-weight: 800;
  font-size: 15px;
  list-style: none;
}

details summary::-webkit-details-marker {
  display: none;
}

details > div, details > .details-body {
  padding: 0 12px 12px 12px;
}

details[open] summary {
  border-bottom: 1px solid var(--line);
}

/* MC FLY — ein Tor zur Zeit, keine Endlos-Animation */

.corridor {
  position: relative;
  min-height: 240px;
  overflow: hidden;
  border: 3px solid var(--bright);
  border-radius: 12px;
  background: #02120a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 12px;
  text-align: center;
  box-shadow: 0 0 24px rgba(0,255,136,.25);
}

.chain-node {
  fill: #001b0a;
  stroke: var(--bright);
  stroke-width: 2;
}

.chain-arrow {
  stroke: var(--bright);
  stroke-width: 2;
}

.chain-label {
  fill: #fff;
  font: 16px Consolas, monospace;
  text-anchor: middle;
  dominant-baseline: middle;
}

.chain-runner {
  fill: #b4ffca;
}

#chainSvg.paused .chain-runner {
  display: none;
}

.bottom-nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: min(480px, 100%);
  z-index: 30;
  background: #020603;
  border-top: 2px solid var(--line);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
}

.bottom-nav button {
  min-height: 56px;
  min-width: 0;
  padding: 6px 2px;
  font-size: 11px;
  font-weight: 800;
  line-height: 1.1;
  overflow-wrap: anywhere;
}

.bottom-nav button.active {
  background: var(--green);
  color: #000;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
    animation: none !important;
  }
}
