  color: var(--text);

  color: #000;
}

::selection {
  background: #00ff00;
  color: #000;
}

.nc-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: 0 0 0 1px #003300 inset;
}

.nc-panel-soft {
  background: var(--panel-2);
  border: 1px solid var(--line-dim);
}

.nc-btn {
  border: 1px solid var(--line);
  background: #000;
  color: var(--text);
  padding: 0.55rem 0.7rem;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  white-space: normal;
  overflow-wrap: anywhere;
}

.nc-btn:hover, .nc-btn.active {
  background: #00ff00;
  color: #000;
}

.nc-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.nc-input, .nc-textarea, .nc-select {
  width: 100%;
  background: #000;
  color: var(--text);
  border: 1px solid var(--line-dim);
  padding: 0.6rem;
  font-family: inherit;
  font-size: 0.85rem;
  outline: none;
  overflow-wrap: anywhere;
}

.nc-input:focus, .nc-textarea:focus, .nc-select:focus {
  border-color: #00ff00;
}

.nc-textarea {
  min-height: 220px;
  line-height: 1.55;
  resize: vertical;
}

.nc-tab {
  border: 1px solid var(--line-dim);
  padding: 0.5rem 0.75rem;
  font-size: 0.8rem;
  cursor: pointer;
  background: #000;
  color: var(--muted);
  font-weight: 700;
}

.nc-tab.active {
  background: #00ff00;
  color: #000;
  border-color: #00ff00;
}
