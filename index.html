  border-radius:10px;
  background:var(--panel2);
  color:var(--text);
  padding:8px 12px;
  cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease
}

button:active{
  transform:scale(.97)
}

button.active{
  background:var(--cyan);
  color:#02101c;
  box-shadow:0 0 18px rgba(102,204,255,.55)
}

button.gold{
  background:#2a2208;
  border-color:var(--gold);
  color:var(--gold)
}

button.gold.active{
  background:var(--gold);
  color:#1a1400
}

input,select,textarea{
  width:100%;
  min-height:44px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#02070e;
  color:var(--text);
  padding:8px 10px
}

textarea{
  min-height:120px;
  resize:vertical
}

.card{

.wrap{

  background:linear-gradient(90deg,var(--cyan),var(--green));
  border-radius:inherit
}

}

@keyframes pulse{

.pulse{
