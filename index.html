<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OS → SYNC · 4 → 19 · 21% → 304%</title>
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070d;
    --os: #6a8aaf;
    --os-dim: rgba(106,138,175,0.5);
    --sync: #ffd700;
    --sync2: #a78bfa;
    --sync3: #38c6e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: #e8e8f0;
    font-family: 'Fragment Mono', ui-monospace, monospace;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }

  header {
    position: fixed; top: 20px; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: space-between; padding: 0 24px;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(232,232,240,0.4); pointer-events: none;
  }
  header b { color: var(--sync); font-weight: normal; }

  .center-info {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5; text-align: center; pointer-events: none;
  }
  .counter {
    font-size: clamp(56px, 12vw, 96px);
    font-weight: 900; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    color: var(--os);
    transition: color 1s;
    text-shadow: 0 0 40px var(--os-dim);
  }
  .state.sync .counter {
    color: var(--sync);
    text-shadow: 0 0 60px rgba(255,215,0,0.5);
  }
  .state-label {
    font-size: 12px; letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--os); margin-top: 12px;
    transition: color 1s;
  }
  .state.sync .state-label { color: var(--sync); }
  .state-sub {
    font-size: 10px; letter-spacing: 0.3em;
    color: rgba(232,232,240,0.35);
    margin-top: 14px;
    max-width: 420px;
    margin-left: auto; margin-right: auto;
    transition: opacity 0.8s;
  }

  .footer-text {
    position: fixed; bottom: 24px; left: 24px; right: 24px;
    z-index: 10;
    display: flex; justify-content: space-between; align-items: flex-end;
    font-size: 10px; letter-spacing: 0.15em;
    color: rgba(232,232,240,0.3);
    text-transform: uppercase; pointer-events: none;
    line-height: 1.8;
  }
  .footer-text b { color: var(--sync); font-weight: normal; }

  .controls {
    position: fixed; bottom: 90px; left: 50%;
    transform: translateX(-50%);
    z-index: 10; display: flex; gap: 6px;
  }
  .btn {
    background: rgba(5,7,13,0.8);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(232,232,240,0.15);
    color: rgba(232,232,240,0.6);
    padding: 10px 22px; border-radius: 100px;
    font: 10px 'Fragment Mono', monospace;
    letter-spacing: 0.22em;
    text-transform: uppercase; cursor: pointer;
    transition: all 0.3s;
  }
  .btn:hover { border-color: var(--sync); color: var(--sync); }
  .btn.on {
    background: rgba(255,215,0,0.1);
    border-color: var(--sync);
    color: var(--sync);
  }

  .narrative {
    position: fixed; top: 60px; right: 24px; z-index: 10;
    max-width: 280px; text-align: right;
    font-size: 11px; line-height: 1.9;
    letter-spacing: 0.02em;
    color: rgba(232,232,240,0.5);
    pointer-events: none;
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
  }
  .narrative .line {
    opacity: 0; transform: translateY(6px);
    transition: opacity 0.8s, transform 0.8s;
    margin-bottom: 4px;
  }
  .narrative .line.show { opacity: 1; transform: translateY(0); }
  .narrative .line.sync { color: var(--sync); }

  @media (max-width: 700px) {
    .narrative {
      top: auto; bottom: 200px;
      left: 20px; right: 20px;
      max-width: none; text-align: left;
      font-size: 10px;
    }
    .controls { bottom: 130px; }
    .footer-text { font-size: 9px; }
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<header>
  <div>iki1uc · 3.eck · OS → SYNC</div>
  <div>MODE <b id="modeLbl">OS</b> · 4 → 19 ACHSEN</div>
</header>

<div class="center-info state" id="state">
  <div class="counter" id="counter">21%</div>
  <div class="state-label" id="stateLbl">OS · FENSTER</div>
  <div class="state-sub" id="stateSub">vier achsen · sicht · nicht motor</div>
</div>

<div class="narrative" id="narrative"></div>

<div class="controls">
  <button class="btn on" id="btnOS">OS</button>
  <button class="btn" id="btnSync">SYNC</button>
  <button class="btn" id="btnMorph">→ MORPH</button>
</div>

<div class="footer-text">
  <div>OS erinnert · SYNC handelt<br><b>OS zeigte den Weg · SYNC geht ihn</b></div>
  <div class="right">Die Geschichte liegt nicht in Seiten<br>Die Geschichte liegt in <b>Zuständen</b></div>
</div>

<script>
(function() {
  "use strict";

  /* ============ SETUP ============ */
  const CV = document.getElementById('cv');
  const ctx = CV.getContext('2d');
  let W, H, DPR;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    CV.width = W * DPR;
    CV.height = H * DPR;
    CV.style.width = W + 'px';
    CV.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ============ STATE ============ */
  const S = {
    mode: 'OS',
    morph: 0,
    morphTarget: 0,
    t: 0,
    counter: 21,
    counterTarget: 21,
    particles: []
  };

  /* ============ 19 ACHSEN ============ */
  // 4 Anker bei N, E, S, W + 15 neue dazwischen
  // Die 4 Anker sind die ursprünglichen OS-Achsen, die "erhalten bleiben"
  const AXES = [
    { name: 'Kernel',   angle: -Math.PI/2,        color: '#ffd700', anchor: 'ANZEIGE' },
    { name: 'Pipeline', angle: -Math.PI/2 + 0.33, color: '#a78bfa' },
    { name: 'Fusion',   angle: -Math.PI/2 + 0.66, color: '#38c6e0' },
    { name: 'Upgrade',  angle: 0,                 color: '#8cf0d0', anchor: 'FENSTER' },
    { name: 'EVO',      angle: 0.33,              color: '#ffd700' },
    { name: 'QI',       angle: 0.66,              color: '#a78bfa' },
    { name: 'IQQ',      angle: Math.PI/2,         color: '#38c6e0', anchor: 'SICHT' },
    { name: 'X86',      angle: Math.PI/2 + 0.33,  color: '#8cf0d0' },
    { name: 'X64',      angle: Math.PI/2 + 0.66,  color: '#ffd700' },
    { name: 'Dual',     angle: Math.PI,           color: '#a78bfa', anchor: 'STRUKTUR' },
    { name: 'System',   angle: Math.PI + 0.33,    color: '#38c6e0' },
    { name: 'Cache',    angle: Math.PI + 0.66,    color: '#8cf0d0' },
    { name: 'Kompass',  angle: -Math.PI/2 - 0.33, color: '#ffd700' },
    { name: 'Mind',     angle: -Math.PI/2 - 0.66, color: '#a78bfa' },
    { name: 'Boot',     angle: -0.33,             color: '#38c6e0' },
    { name: 'Bio',      angle: -0.66,             color: '#8cf0d0' },
    { name: 'Geo',      angle: Math.PI/2 - 0.33,  color: '#ffd700' },
    { name: 'Dia',      angle: Math.PI/2 - 0.66,  color: '#a78bfa' },
    { name: 'Move',     angle: Math.PI - 0.33,    color: '#38c6e0' }
  ];

  /* ============ PARTICLES ============ */
  for (let i = 0; i < 100; i++) {
    S.particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      size: 0.5 + Math.random() * 1.2,
      alpha: 0.1 + Math.random() * 0.35,
      hue: Math.random() * 360
    });
  }

  /* ============ NARRATIVE ============ */
  const NARRATIVE = [
    { text: 'Nicht jedes System beginnt vollständig.', sync: false },
    { text: 'Manche beginnen als Blickrichtung.', sync: false },
    { text: 'OS war die erste Sicht. Vier Achsen. ≈21%.', sync: false },
    { text: 'OS war Fenster. Nicht Motor.', sync: false },
    { text: 'Im Laufe der Pipeline entstand SYNC.', sync: true },
    { text: 'Nicht als Ersatz. Sondern als Verschmelzung.', sync: true },
    { text: 'SYNC erweiterte vier Achsen zu neunzehn.', sync: true },
    { text: '≈21% wurden ≈304%.', sync: true },
    { text: 'Sicht wurde Fluss. Struktur wurde Kernel.', sync: true },
    { text: 'OS bleibt erhalten. Jede Wahrheit besitzt einen Ursprung.', sync: false },
    { text: 'OS ist historisch. SYNC ist operativ.', sync: true },
    { text: 'OS zeigte den Weg. SYNC geht ihn.', sync: true }
  ];

  let narrativeShown = 0;
  const narrativeEl = document.getElementById('narrative');

  function updateNarrative() {
    narrativeEl.innerHTML = NARRATIVE.map((n, i) =>
      '<div class="line ' + (n.sync ? 'sync ' : '') + (i < narrativeShown ? 'show' : '') + '">' + n.text + '</div>'
    ).join('');
  }
  updateNarrative();

  // Reveal lines gradually
  let narrativeTimer = setInterval(() => {
    if (narrativeShown < NARRATIVE.length) {
      narrativeShown++;
      updateNarrative();
    } else {
      clearInterval(narrativeTimer);
    }
  }, 900);

  function restartNarrative() {
    narrativeShown = 0;
    updateNarrative();
    clearInterval(narrativeTimer);
    narrativeTimer = setInterval(() => {
      if (narrativeShown < NARRATIVE.length) {
        narrativeShown++;
        updateNarrative();
      } else {
        clearInterval(narrativeTimer);
      }
    }, 700);
  }

  /* ============ MODE ============ */
  function setMode(mode) {
    if (mode === 'MORPH') {
      setMode(S.mode === 'OS' ? 'SYNC' : 'OS');
      return;
    }
    S.mode = mode;
    const stateEl = document.getElementById('state');
    const stateLbl = document.getElementById('stateLbl');
    const stateSub = document.getElementById('stateSub');
    const modeLbl = document.getElementById('modeLbl');

    if (mode === 'OS') {
      S.morphTarget = 0;
      S.counterTarget = 21;
      stateEl.classList.remove('sync');
      stateLbl.textContent = 'OS · FENSTER';
      stateSub.textContent = 'vier achsen · sicht · nicht motor';
      modeLbl.textContent = 'OS';
    } else {
      S.morphTarget = 1;
      S.counterTarget = 304;
      stateEl.classList.add('sync');
      stateLbl.textContent = 'SYNC · MOTOR';
      stateSub.textContent = 'neunzehn achsen · fluss · kernel · operation';
      modeLbl.textContent = 'SYNC';
    }

    document.querySelectorAll('.btn').forEach(b => b.classList.remove('on'));
    if (mode === 'OS') document.getElementById('btnOS').classList.add('on');
    if (mode === 'SYNC') document.getElementById('btnSync').classList.add('on');

    restartNarrative();
  }

  document.getElementById('btnOS').onclick = () => setMode('OS');
  document.getElementById('btnSync').onclick = () => setMode('SYNC');
  document.getElementById('btnMorph').onclick = () => setMode('MORPH');

  /* ============ DRAW ============ */
  let lastT = performance.now();

  function draw(now) {
    requestAnimationFrame(draw);
    const dt = Math.min(0.033, (now - lastT) / 1000);
    lastT = now;
    S.t += dt;

    // Smooth morph
    if (Math.abs(S.morph - S.morphTarget) < 0.003) {
      S.morph = S.morphTarget;
    } else {
      S.morph += (S.morphTarget - S.morph) * Math.min(1, dt * 1.6);
    }

    // Smooth counter
    S.counter += (S.counterTarget - S.counter) * Math.min(1, dt * 1.5);
    document.getElementById('counter').textContent = Math.round(S.counter) + '%';

    /* ---- BACKGROUND ---- */
    ctx.fillStyle = '#05070d';
    ctx.fillRect(0, 0, W, H);

    // Ambient glow — cold to warm
    const cx = W / 2, cy = H / 2;
    const glowR = Math.min(W, H) * 0.6;
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
    const gAlpha = 0.06 + S.morph * 0.15;
    if (S.morph < 0.5) {
      glow.addColorStop(0, 'rgba(106,138,175,' + gAlpha + ')');
    } else {
      glow.addColorStop(0, 'rgba(255,215,0,' + gAlpha + ')');
    }
    glow.addColorStop(1, 'rgba(5,7,13,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // Vignette
    const vig = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.85);
    vig.addColorStop(0, 'rgba(5,7,13,0)');
    vig.addColorStop(1, 'rgba(5,7,13,0.85)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    // Particles
    for (const p of S.particles) {
      p.x += p.vx * (1 + S.morph * 0.8);
      p.y += p.vy * (1 + S.morph * 0.8);
      if (p.x < 0) p.x = W;
      if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H;
      if (p.y > H) p.y = 0;

      ctx.globalAlpha = p.alpha * (0.4 + S.morph * 0.6);
      if (S.morph < 0.5) {
        ctx.fillStyle = 'hsl(' + ((p.hue + 190) % 360) + ',25%,55%)';
      } else {
        ctx.fillStyle = 'hsl(' + ((p.hue + S.t * 25) % 360) + ',85%,65%)';
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* ---- AXES ---- */
    const R = Math.min(W, H) * 0.34;

    // Base circle
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = S.morph < 0.5
      ? 'rgba(106,138,175,0.1)'
      : 'rgba(255,215,0,0.12)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 8]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Each axis
    for (let i = 0; i < AXES.length; i++) {
      const ax = AXES[i];
      const isAnchor = !!ax.anchor;

      // Visibility: anchors always visible, others fade in with morph
      let visibility;
      if (isAnchor) {
        visibility = 1;
      } else {
        visibility = S.morph;
      }
      if (visibility < 0.02) continue;

      // Color
      let color;
      if (isAnchor) {
        // Anchors stay their OS color at morph=0, become their SYNC color at morph=1
        color = S.morph < 0.5 ? '#6a8aaf' : ax.color;
      } else {
        color = ax.color;
      }

      // Length
      const len = R * (isAnchor ? 1 : 0.55 + S.morph * 0.45);

      // Endpoint
      const ex = cx + Math.cos(ax.angle) * len;
      const ey = cy + Math.sin(ax.angle) * len;

      // Line
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(ex, ey);
      ctx.strokeStyle = color;
      ctx.globalAlpha = visibility * (isAnchor ? 0.85 : 0.5 + S.morph * 0.4);
      ctx.lineWidth = isAnchor ? 2 : 1.2;
      ctx.stroke();
      ctx.globalAlpha = 1;

      // Endpoint dot
      const dotR = isAnchor ? 5 : 3;
      ctx.beginPath();
      ctx.arc(ex, ey, dotR, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.globalAlpha = visibility;
      ctx.fill();
      ctx.globalAlpha = 1;

      // Halo for anchors
      if (isAnchor) {
        const halo = ctx.createRadialGradient(ex, ey, 0, ex, ey, 22);
        halo.addColorStop(0, color.replace(')', ',0.3)').replace('rgb', 'rgba').replace('#', ''));
        // fallback for hex
        halo.addColorStop(0, hexToRgba(color, 0.35));
        halo.addColorStop(1, hexToRgba(color, 0));
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(ex, ey, 22, 0, Math.PI * 2);
        ctx.fill();
      }

      // Label
      if (visibility > 0.35) {
        const labelX = ex + Math.cos(ax.angle) * 20;
        const labelY = ey + Math.sin(ax.angle) * 20;
        const flip = Math.cos(ax.angle) < 0;

        ctx.save();
        ctx.translate(labelX, labelY);
        ctx.rotate(ax.angle + (flip ? Math.PI : 0));
        ctx.fillStyle = color;
        ctx.globalAlpha = visibility * 0.9;
        ctx.font = (isAnchor ? 'bold 10px' : '9px') + ' "Fragment Mono", monospace';
        ctx.textAlign = flip ? 'right' : 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(ax.name.toUpperCase(), 0, 0);
        ctx.globalAlpha = 1;
        ctx.restore();

        // For anchors in OS mode, show the "wird" hint
        if (isAnchor && S.morph < 0.3) {
          ctx.save();
          ctx.translate(labelX, labelY);
          ctx.rotate(ax.angle + (flip ? Math.PI : 0));
          ctx.fillStyle = 'rgba(106,138,175,0.5)';
          ctx.font = '8px "Fragment Mono", monospace';
          ctx.textAlign = flip ? 'right' : 'left';
          ctx.textBaseline = 'top';
          ctx.fillText('→ ' + ax.name, 0, 10);
          ctx.restore();
        }
      }
    }

    /* ---- CENTER ---- */
    const centerGlowR = 70;
    const centerGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, centerGlowR);
    const centerColor = S.morph > 0.5 ? '255,215,0' : '106,138,175';
    centerGrad.addColorStop(0, 'rgba(' + centerColor + ',' + (0.4 + S.morph * 0.3) + ')');
    centerGrad.addColorStop(0.5, 'rgba(' + centerColor + ',' + (0.1 + S.morph * 0.1) + ')');
    centerGrad.addColorStop(1, 'rgba(' + centerColor + ',0)');
    ctx.fillStyle = centerGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, centerGlowR, 0, Math.PI * 2);
    ctx.fill();

    // Center dot
    ctx.beginPath();
    ctx.arc(cx, cy, 5 + Math.sin(S.t * 2.5) * 1.5, 0, Math.PI * 2);
    ctx.fillStyle = S.morph > 0.5 ? '#ffd700' : '#6a8aaf';
    ctx.fill();

    // Pulse ring
    const pulse = (S.t * 0.5) % 1;
    const pulseR = 6 + pulse * 40;
    ctx.beginPath();
    ctx.arc(cx, cy, pulseR, 0, Math.PI * 2);
    ctx.strokeStyle = S.morph > 0.5
      ? 'rgba(255,215,0,' + (1 - pulse) * 0.4 + ')'
      : 'rgba(106,138,175,' + (1 - pulse) * 0.4 + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function hexToRgba(hex, a) {
    if (!hex || hex[0] !== '#') return hex;
    const h = hex.slice(1);
    const r = parseInt(h.substr(0, 2), 16);
    const g = parseInt(h.substr(2, 2), 16);
    const b = parseInt(h.substr(4, 2), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  requestAnimationFrame(draw);

})();
</script>
</body>
</html>
