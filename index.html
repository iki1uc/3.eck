<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Kurzbio, Links und Kontakt.">
<title>bio.tel · Dein Name</title>

<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --panel: #040404;
  --text: #00ff00;
  --muted: #00b300;
  --dim: #007a00;
  --line: #00ff00;
  --line-dim: #1e5a1e;
}

* { box-sizing: border-box; }

html {
  min-width: 320px;
  background: var(--bg);
}

body {
  min-height: 100vh;
  margin: 0;
  padding: 24px 16px 48px;
  display: flex;
  justify-content: center;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
    "Liberation Mono", "Courier New", monospace;
}

::selection {
  background: var(--text);
  color: #000;
}

.wrap {
  display: flex;
  width: 100%;
  max-width: 560px;
  flex-direction: column;
  gap: 14px;
}

.panel {
  padding: 14px;
  border: 1px solid var(--line-dim);
  background: var(--panel);
}

.panel--strong {
  border-color: var(--line);
  box-shadow: inset 0 0 0 1px #003300;
}

.path {
  color: var(--muted);
  font-size: 13px;
  letter-spacing: .04em;
}

.path b { color: var(--text); }

h1 {
  margin: 8px 0 2px;
  font-size: clamp(20px, 6vw, 30px);
  line-height: 1.15;
  letter-spacing: .02em;
}

h2 {
  margin: 0 0 8px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}

p { margin: 0 0 10px; }
p:last-child { margin-bottom: 0; }

.handle {
  color: var(--muted);
  font-size: 14px;
}

.dim { color: var(--dim); }

.links {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.link,
.mail-row {
  display: flex;
  min-width: 0;
  align-items: center;
  justify-content: space-between;
  gap: 8px 12px;
  padding: 11px 12px;
  border: 1px solid var(--line);
  background: #000;
}

.link {
  color: var(--text);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .03em;
  text-decoration: none;
}

.link-label { flex: 0 0 auto; }

.link-detail,
.copy-status {
  min-width: 0;
  color: var(--muted);
  font-size: 13px;
  font-weight: 400;
  overflow-wrap: anywhere;
  text-align: right;
}

.link:hover,
.link:focus-visible {
  background: var(--text);
  color: #000;
}

.link:hover .link-detail,
.link:focus-visible .link-detail {
  color: #000;
}

.link:focus-visible,
.copy-email:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 3px;
}

.mail-row {
  flex-wrap: wrap;
  color: var(--text);
  font-size: 14px;
  font-weight: 700;
}

.copy-email {
  min-height: 44px;
  max-width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--line-dim);
  border-radius: 0;
  background: #000;
  color: var(--muted);
  font: inherit;
  font-weight: 400;
  overflow-wrap: anywhere;
  cursor: pointer;
  touch-action: manipulation;
}

.copy-email:hover {
  background: var(--text);
  color: #000;
}

.copy-status {
  flex-basis: 100%;
  min-height: 1em;
  text-align: left;
}

.cursor {
  display: inline-block;
  width: .6em;
  height: 1em;
  margin-left: .15em;
  background: var(--text);
  vertical-align: -.12em;
  animation: blink 1.1s steps(2, start) infinite;
}

footer {
  margin-top: 6px;
  color: var(--dim);
  font-size: 12px;
  letter-spacing: .05em;
  text-align: center;
}

@keyframes blink {
  to { visibility: hidden; }
}

@media (max-width: 380px) {
  .link,
  .mail-row {
    align-items: flex-start;
    flex-direction: column;
  }

  .link-detail { text-align: left; }
  .copy-email { width: 100%; text-align: left; }
}

@media (prefers-reduced-motion: reduce) {
  .cursor { animation: none; }
}
</style>
</head>

<body>
<main class="wrap">
  <header class="panel panel--strong">
    <div class="path">
      user@bio.tel:~$ <b>whoami</b><span class="cursor" aria-hidden="true"></span>
    </div>
    <h1>DEIN NAME</h1>
    <div class="handle">@deinhandle</div>
  </header>

  <section class="panel" aria-labelledby="about-heading">
    <h2 id="about-heading">// about</h2>
    <p>Kurzbio in zwei oder drei Zeilen. Was du machst und woran du arbeitest.</p>
    <p class="dim">Stand: 2026</p>
  </section>

  <nav class="links" aria-label="Profil-Links">
    <a
      class="link"
      href="https://github.com/deinhandle"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="link-label">github</span>
      <span class="link-detail">github.com/deinhandle</span>
    </a>

    <a
      class="link"
      href="https://deine-seite.tld"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="link-label">website</span>
      <span class="link-detail">deine-seite.tld</span>
    </a>

    <a
      class="link"
      href="https://mastodon.social/@deinhandle"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="link-label">mastodon</span>
      <span class="link-detail">@deinhandle@mastodon.social</span>
    </a>

    <div class="mail-row" role="group" aria-label="E-Mail-Kontakt">
      <span class="link-label">mail</span>
      <button
        class="copy-email"
        id="mailText"
        type="button"
        aria-label="E-Mail-Adresse du@example.com kopieren"
      >du@example.com</button>
      <span class="copy-status" id="mailStatus" aria-live="polite"></span>
    </div>
  </nav>

  <footer>no tracking · no cookies · no framework</footer>
</main>

<script>
"use strict";

const mailButton = document.getElementById("mailText");
const mailStatus = document.getElementById("mailStatus");
const email = "du@example.com";

mailButton.addEventListener("click", async () => {
  try {
    if (!navigator.clipboard?.writeText) {
      throw new Error("Clipboard nicht verfügbar");
    }

    await navigator.clipboard.writeText(email);
    mailStatus.textContent = "Kopiert";
  } catch {
    window.location.href = `mailto:${email}`;
    mailStatus.textContent = "E-Mail-App geöffnet";
  }

  window.setTimeout(() => {
    mailStatus.textContent = "";
  }, 1800);
});
</script>
</body>
</html>
