:root {
  --bg: #0e1116;
  --card: #181c23;
  --line: #2a303a;
  --txt: #ffffff;
  --muted: #aab4c2;
  --green: #46ff9a;
  --red: #ff5858;
  --blue: #5ea7ff;
  --panel: #181c23;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1116;
    --card: #181c23;
    --line: #2a303a;
    --txt: #ffffff;
    --muted: #aab4c2;
    --green: #46ff9a;
    --red: #ff5858;
    --blue: #5ea7ff;
    --panel: #181c23;
  }
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--txt);
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
}

.badge {
  background: #222831;
  border: 1px solid var(--line);
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .02em;
  white-space: nowrap;
}

.cell {
  height: 56px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #262d38;
  color: #fff;
  font-size: 18px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .12s ease, color .12s ease, transform .08s ease;
}

.cell:active {
  transform: scale(.97);
}

.cell.active {
  background: var(--green);
  color: #000;
  border-color: var(--green);
}

.cell:focus-visible, .ctl:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

.ctl {
  padding: 12px 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-weight: 800;
  font-size: 14px;
  background: #262d38;
  color: #fff;
}

.ctl.primary {
  background: var(--green);
  color: #000;
  border-color: var(--green);
}

.ctl.danger {
  background: #3a2328;
  color: #ffd7d7;
  border-color: #5a2f35;
}

.ctl.danger.on {
  background: var(--red);
  color: #000;
  border-color: var(--red);
}

.bar {
  height: 26px;
  background: #29303a;
  margin-bottom: 6px;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}

.fill {
  height: 100%;
  background: var(--blue);
  display: flex;
  align-items: center;
  padding-left: 8px;
  font-size: 13px;
  font-weight: 800;
  color: #06121f;
  min-width: 28px;
}

.trioFill {
  height: 100%;
  background: var(--green);
  display: flex;
  align-items: center;
  padding-left: 8px;
  font-size: 13px;
  font-weight: 800;
  color: #02120a;
  min-width: 28px;
}

.logbox {
  height: 220px;
  overflow-y: auto;
  overflow-x: clip;
  white-space: pre-wrap;
  font-size: 12px;
  line-height: 1.55;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  overflow-wrap: anywhere;
  background: #10141a;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
}

.jsonbox {
  width: 100%;
  height: 132px;
  background: #10141a;
  color: #fff;
  border: 1px solid #444;
  border-radius: 8px;
  padding: 10px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  resize: vertical;
}

.small {
  font-size: 12px;
  color: var(--muted);
}
