* {

html, body {

  color: var(--green);
}

body {

}

button, input, select, textarea {
  font: inherit;
  color: var(--green);
}

button, select, input[type="text"], input[type="number"] {
  min-height: 35px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--panel2);
}

button {
  cursor: pointer;
}

button:hover, button.active, button.selected {
  background: var(--green);
  color: #000;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
  outline: 2px solid var(--white);
  outline-offset: 2px;
}

textarea {
  width: 100%;
  min-height: 170px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #000;
  resize: vertical;
  -moz-tab-size: 2;
    -o-tab-size: 2;
       tab-size: 2;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  margin: 10px 0;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  margin: 10px 0;
}

.badge {
  background: var(--panel2);
  border: 1px solid var(--line);
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  color: var(--green);
}

.anchor {
  display: inline-block;
  margin: 2px;
  padding: 2px 7px;
  border: 1px solid var(--line);
  color: var(--white);
}

.small {
  font-size: 12px;
  color: var(--muted);
}

.good {
  color: var(--green);
}

.warn {
  color: var(--yellow);
}

.err {

}

.cell {

  border-radius: 8px;
  background: var(--panel2);
  color: var(--green);
  font-size: 18px;
  font-weight: 800;
  display: flex;

  justify-content: center;

.cell:active {

.cell.active {

.cell:focus-visible, .ctl:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--white);
  outline-offset: 2px;
}

.ctl {

.ctl.primary {
  background: var(--green);

}

.ctl.danger {
  background: #380000;
  color: #ffd7d7;
  border-color: #5a2f35;
}

.ctl.danger.on {
  background: var(--red);
  color: #000;
  border-color: var(--red);
}

.bar {

  margin-bottom: 6px;
  border-radius: 6px;
  overflow: hidden;
}

.fill {

  align-items: center;

  font-size: 13px;
  font-weight: 800;
  color: #06121f;
  min-width: 28px;

.trioFill {

  padding-left: 8px;

  font-weight: 800;
  color: #02120a;

.logbox {

  overflow-x: clip;

  font-size: 12px;
  line-height: 1.55;
  font-family: Consolas, "Cascadia Mono", monospace;
  overflow-wrap: anywhere;
  background: #000;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 10px;
}

.jsonbox {
  width: 100%;
  height: 132px;

  border: 1px solid var(--line);
  border-radius: 4px;
  background: #000;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.gate {
  padding: 14px;
  border: 2px solid #666;
  border-radius: 7px;
  background: #111;
  color: #aaa;
  text-align: center;
  font-size: 22px;
  font-weight: 800;
}

.gate.pass {
  border-color: var(--bright);
  background: #003811;
  color: var(--bright);
}

.gate.tune {
  border-color: var(--yellow);
  background: #382f00;
  color: var(--yellow);
}

.gate.fail {
  border-color: var(--red);
  background: #380000;
  color: var(--red);
}

.ladder {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  font-weight: bold;
}

  min-width: 55px;
  padding: 6px 9px;
  border: 1px solid var(--line);
  text-align: center;
}

.rung.ok {
  border-color: var(--green);
  color: var(--green);
}

.rung.pending {
  border-color: var(--yellow);
  color: var(--yellow);
}

.rung.fail {
  border-color: var(--red);
  color: var(--red);

table {
  width: 100%;
  border-collapse: collapse;
  font-size: .85rem;

  padding: 6px 8px;

.knot-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(65px, 1fr));
  gap: 8px;
  max-width: 360px;
}

.knot {
  display: grid;

  padding: 5px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: #020603;
  color: var(--green);
  cursor: pointer;
  text-align: center;
  font-size: 12px;
}

.knot.partner {
  border-color: var(--green);
  box-shadow: 0 0 14px var(--green);
}

.knot.selected {
  background: var(--green);
  color: #000;
}

/* MC FLY CORRIDOORING */

.corridor {
  position: relative;
  height: 280px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: radial-gradient(ellipse at center, #02120a 0%, #000 70%);
}

.corridor-frame {
  position: absolute;
  left: 50%;
  top: 50%;
  border: 2px solid var(--bright);
  border-radius: 8px;
  box-shadow: 0 0 18px rgba(0,255,136,.55);
  opacity: 0;
  transform: translate(-50%,-50%) scale(.15);
}

.corridor.flying .corridor-frame {
  animation: corridorFly 3s linear infinite;
}

.corridor-gate {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  border: 3px solid var(--bright);
  border-radius: 10px;
  background: rgba(0,20,8,.85);
  box-shadow: 0 0 30px var(--bright);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 14px 22px;
  opacity: 0;
}

.corridor.flying .corridor-gate {
  animation: gateFly 3s linear infinite;
}

.corridor.paused .corridor-frame, .corridor.paused .corridor-gate {
  animation-play-state: paused;
}

@keyframes corridorFly {
  0% {
    opacity: 0;
    transform: translate(-50%,-50%) scale(.12);
    width: 60px;
    height: 40px;
  }

  15% {
    opacity: .9;
  }

  90% {
    opacity: .9;
  }

  100% {
    opacity: 0;
    transform: translate(-50%,-50%) scale(2.6);
    width: 60px;
    height: 40px;
  }
}

@keyframes gateFly {
  0% {
    opacity: 0;
    transform: translate(-50%,-50%) scale(.1);
  }

  20% {
    opacity: 1;
  }

  80% {
    opacity: 1;
    transform: translate(-50%,-50%) scale(1.15);
  }

  100% {
    opacity: 0;
    transform: translate(-50%,-50%) scale(2.4);
  }
}

.chain-node {
  fill: #001b0a;
  stroke: var(--bright);
  stroke-width: 2;
}

.chain-arrow {
  stroke: var(--bright);
  stroke-width: 2;
}

.chain-label {
  fill: #fff;
  font: 16px Consolas, monospace;
  text-anchor: middle;
  dominant-baseline: middle;
}

.chain-runner {
  fill: #b4ffca;
  filter: drop-shadow(0 0 7px #00ff88);
}

#chainSvg.paused .chain-runner {
  display: none;
}

@media (max-width: 600px) {
  .corridor {
    height: 240px;
  }

  table {
    font-size: .76rem;
  }

  th, td {
    padding: 5px 4px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
    animation: none !important;
  }

  .corridor-frame, .corridor-gate {
    animation: none !important;
    opacity: 1 !important;
  }
