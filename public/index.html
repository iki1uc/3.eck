<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3.eck · Zugang</title>
<style>
  body { margin:0; background:#05070d; color:#e8e8f2; font-family:ui-monospace,monospace;
         min-height:100vh; display:grid; place-items:center; padding:20px; }
  .card { max-width:440px; width:100%; background:#0a0e17; border:1px solid #1a2133;
          border-radius:16px; padding:28px; }
  h1 { margin:0 0 6px; font-size:20px; color:#ffd700; letter-spacing:.06em; }
  .sub { font-size:11px; color:#888; letter-spacing:.14em; text-transform:uppercase; }
  .status { margin:20px 0; padding:14px; border-radius:10px; font-size:12px; line-height:1.6; }
  .closed { background:rgba(255,58,122,.08); border:1px solid rgba(255,58,122,.35); color:#ff5a7a; }
  .open { background:rgba(58,255,198,.08); border:1px solid rgba(58,255,198,.4); color:#3affc6; }
  .warn { background:rgba(255,215,0,.08); border:1px solid rgba(255,215,0,.4); color:#ffd700; }
  button, a.btn { display:block; width:100%; padding:12px; border-radius:8px; border:0;
           font-family:inherit; font-size:13px; font-weight:700; letter-spacing:.08em;
           cursor:pointer; margin-top:8px; text-align:center; text-decoration:none;
           box-sizing:border-box; }
  .btn-primary { background:#ffd700; color:#000; }
  .btn-secondary { background:#111827; color:#e8e8f2; border:1px solid #1a2133; }
  .user { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .user img { width:36px; height:36px; border-radius:50%; }
  .hint { font-size:10px; color:#666; margin-top:10px; line-height:1.5; }
</style>
</head>
<body>
<div class="card">
  <h1>3.eck</h1>
  <div class="sub">Zugang · Discord-verifiziert</div>
  <div id="content">Lade…</div>
</div>

<script>
async function render() {
  const el = document.getElementById('content');
  let me;
  try { me = await (await fetch('/api/me')).json(); }
  catch { el.innerHTML = '<div class="status closed">Server nicht erreichbar</div>'; return; }

  if (!me.authenticated) {
    el.innerHTML = `
      <div class="status closed"><b>Nicht verbunden.</b><br>Melde dich mit Discord an.</div>
      <a class="btn btn-primary" href="/auth/discord">Mit Discord anmelden</a>
      <div class="hint">Gelesen werden nur: Discord-Name, Avatar, Server-Mitgliedschaft.
      Keine Nachrichten, keine E-Mails, kein Passwort.</div>`;
    return;
  }

  const userBlock = `
    <div class="user">
      ${me.avatar ? `<img src="${me.avatar}" alt="">` : ''}
      <div>
        <b>${me.username}${me.discriminator !== '0' ? '#' + me.discriminator : ''}</b>
        <div class="hint">ID: ${me.id}</div>
      </div>
    </div>`;

  if (!me.inGuild) {
    el.innerHTML = userBlock + `
      <div class="status closed">
        <b>Zugang verweigert.</b><br>
        Du bist nicht auf dem Server.
      </div>
      <a class="btn btn-primary" href="${window.__INVITE || 'https://discord.gg/dein-invite'}" target="_blank" rel="noopener">Server beitreten</a>
      <button class="btn-secondary" onclick="location.reload()">Neu prüfen</button>
      <div class="hint">Sobald du auf dem Server bist, hast du automatisch Zugang.
      Verlässt du ihn, endet der Zugang sofort.</div>`;
    return;
  }

  el.innerHTML = userBlock + `
    <div class="status open">
      <b>✓ Zugang aktiv</b><br>
      Du bist auf dem Server. Nutzung freigeschaltet.
    </div>
    <a class="btn btn-primary" href="/app">3.eck öffnen</a>
    <div class="hint">Der Zugang bleibt, solange du auf dem Server bist.
    Er endet automatisch, wenn du ihn verlässt.</div>`;
}
render();
</script>
</body>
</html>
